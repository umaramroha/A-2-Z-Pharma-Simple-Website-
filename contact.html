<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2Z Pharma | Contact</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">A2Z<span style="color:#333">Pharma</span>.</div>
        <div class="search-wrapper">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products...">
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="blog.html">Journal</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <section class="page-content">
        <h1>Contact Us</h1>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
            <div>
                <h3>Get in Touch</h3>
                <p style="margin-bottom: 10px;"><i class="fas fa-map-marker-alt" style="color:var(--primary)"></i> Shop No. 12, Main Market, Amroha, UP</p>
                <p style="margin-bottom: 10px;"><i class="fas fa-phone" style="color:var(--primary)"></i> +91 84101 27168</p>
                <p><i class="fab fa-whatsapp" style="color:var(--primary)"></i> +91 84101 27168</p>
            </div>
            <form class="contact-form">
                <input type="text" placeholder="Your Name" required>
                <input type="text" placeholder="Phone Number" required>
                <textarea rows="4" placeholder="Your Message or Order Details"></textarea>
                <button type="submit" class="btn-buy" style="border:none; cursor:pointer;">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="copyright">© 2026 A2Z Pharma. All Rights Reserved.</div>
    </footer>
</body>
</html>
